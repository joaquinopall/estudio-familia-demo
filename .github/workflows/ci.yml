# CI (SPEC §13, NFR-MANT-02, NFR-SEC-08).
# Required check for merging into main: "CI / verify".
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fictitious value: src/lib/env.schema.ts requires it at build time. No secrets in CI.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit and integration tests
        run: npm run test

      - name: Build
        run: npm run build

      # Blocking: only dependencies that ship to production.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Informational: full audit including dev tooling. Does not block while
      # GHSA-fc5q-39xc-vjpf (picomatch, dev-only, no patched version) has no fix.
      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
