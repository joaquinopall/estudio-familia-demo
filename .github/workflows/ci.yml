# CI (SPEC §13, NFR-MANT-02, NFR-SEC-08).
# Required check for merging into main: "CI / verify".
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Fictitious values: src/lib/env.schema.ts requires them at build time (F3-05). Nothing
      # connects to them: the build is static and unit tests use fakes. No secrets in CI.
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: 1x00000000000000000000AA
      DATABASE_URL: postgresql://ci:ci@db.invalid:6543/postgres
      RESEND_API_KEY: re_ci_fake
      EMAIL_FROM: "Estudio <onboarding@resend.dev>"
      FIRM_NOTIFICATION_EMAIL: ci@example.com
      TURNSTILE_SECRET_KEY: 1x0000000000000000000000000000000AA
      UPSTASH_REDIS_REST_URL: https://ci.upstash.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-fake-token
      IP_HASH_SALT: ci-fake-salt-not-a-secret-0123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit and integration tests
        run: npm run test

      - name: Build
        run: npm run build

      # Blocking: only dependencies that ship to production.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Informational: full audit including dev tooling. Does not block while
      # GHSA-fc5q-39xc-vjpf (picomatch, dev-only, no patched version) has no fix.
      - name: Audit all dependencies (informational)
        continue-on-error: true
        run: npm audit --audit-level=high
