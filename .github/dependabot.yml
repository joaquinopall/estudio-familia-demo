# Dependabot version updates (NFR-SEC-08). PRs target the default branch (main).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Minor and patch updates arrive together in one PR; majors come separately.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the Node.js major in `engines` / .nvmrc (24). Remove when upgrading Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7.0 yet (lint fails; see PR #7).
      # Review when typescript-eslint announces TS 7 support, or at the end of Phase 3.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Argentina/Buenos_Aires
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        update-types: [minor, patch]
